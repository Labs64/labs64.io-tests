name: Labs64.IO - Regression Tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # nightly full regression
  release:
    types: [created]      # item 12: full regression is also a release gate, not just nightly

env:
  # All tests run through the gateway edge, never straight to a backend port.
  # Authorization is enforced at the gateway. Override these via repository/environment
  # variables to point at the stack under test (e.g. a self-hosted runner attached to the
  # local k3d cluster). mock-oidc mints scoped M2M tokens on demand; see resources/common.resource.
  GATEWAY_BASE_URL: ${{ vars.GATEWAY_BASE_URL || 'http://gateway.localhost' }}
  AUDITFLOW_BASE_URL: ${{ vars.AUDITFLOW_BASE_URL || 'http://gateway.localhost/auditflow/api/v1' }}
  PAYMENT_GATEWAY_BASE_URL: ${{ vars.PAYMENT_GATEWAY_BASE_URL || 'http://gateway.localhost/payment-gateway/api/v1' }}
  CHECKOUT_BASE_URL: ${{ vars.CHECKOUT_BASE_URL || 'http://gateway.localhost/checkout/api/v1' }}
  MOCK_OIDC_BASE_URL: ${{ vars.MOCK_OIDC_BASE_URL || 'http://mock-oidc.localhost' }}
  OIDC_ISSUER_ID: ${{ vars.OIDC_ISSUER_ID || 'labs64io' }}
  # Optional static override for environments where mock-oidc isn't reachable.
  API_TOKEN: ${{ secrets.API_TOKEN }}

jobs:
  smoke:
    name: Smoke — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auditflow
          - payment-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Robot Framework and libraries
        run: pip install -r requirements.txt

      - name: Smoke suite — ${{ matrix.service }}
        run: |
          robot \
            --include smoke \
            --outputdir results/${{ matrix.service }} \
            --output output.xml \
            --log log.html \
            --report report.html \
            ../labs64.io-${{ matrix.service }}/tests/e2e/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-report-${{ matrix.service }}
          path: results/${{ matrix.service }}

  auth-enforcement-coverage:
    name: Auth Enforcement Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Robot Framework and libraries
        run: pip install -r requirements.txt

      - name: Every protected operation has a generated edge test
        # Roadmap item 2, step 3: an operation that declares x-labs64-auth without a
        # generated test must break the build — silence must not read as success.
        # Regenerates from the module specs and fails if the committed suite differs.
        run: python scripts/generate_auth_enforcement_suite.py --check

  p0-blockers:
    name: P0 Blocker Tests
    runs-on: ubuntu-latest
    needs: [smoke, auth-enforcement-coverage]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Robot Framework and libraries
        run: pip install -r requirements.txt

      - name: P0-blocker regression tests
        run: |
          robot \
            --include p0-blocker \
            --outputdir results/p0-blockers \
            --output output.xml \
            --log log.html \
            --report report.html \
            tests/ ../labs64.io-auditflow/tests/e2e/ ../labs64.io-checkout/tests/e2e/ ../labs64.io-payment-gateway/tests/e2e/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p0-blocker-report
          path: results/p0-blockers

  # Runs nightly AND on every GitHub release (item 12's "green in CI on every
  # release" — a scheduled-only run would not gate an actual release). Includes
  # the six item-12 suites (pipeline_routing, condition_operators, redaction,
  # dlq_replay, quota_enforcement, secret_ref_resolution) via the `regression`
  # tag, alongside every other `regression`-tagged case.
  nightly-regression:
    name: Full Regression (nightly + release gate)
    if: github.event_name == 'schedule' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Robot Framework and libraries
        run: pip install -r requirements.txt

      - name: Full regression across all services
        run: |
          robot \
            --include regression \
            --exclude flaky \
            --outputdir results/nightly \
            --output output.xml \
            --log log.html \
            --report report.html \
            tests/ ../labs64.io-auditflow/tests/e2e/ ../labs64.io-checkout/tests/e2e/ ../labs64.io-payment-gateway/tests/e2e/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-regression-report
          path: results/nightly
